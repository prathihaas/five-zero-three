<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu · Five Zero Three</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=Caveat:wght@400;500;600;700&family=Bungee&family=Rubik+Mono+One&family=JetBrains+Mono:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css?v=2">
<style>
  body { padding: 40px 20px; background: #2a2520; }
  .menu-sheet {
    width: 780px; margin: 0 auto;
    background: var(--cream-light);
    padding: 52px 48px 40px;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .menu-sheet::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 10% 20%, rgba(201, 168, 118, 0.12), transparent 40%),
      radial-gradient(ellipse at 90% 80%, rgba(201, 168, 118, 0.1), transparent 40%);
    pointer-events: none;
  }
  .clip {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px;
    background: #8a8a8a;
    border-radius: 4px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.3);
    z-index: 10;
  }
  .clip::before {
    content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 6px; background: #555; border-radius: 2px;
  }
  .menu-col h3 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.08em;
    margin: 0 0 4px;
    padding-bottom: 6px;
    border-bottom: 2.5px solid var(--ink);
  }
  .menu-col .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dotted rgba(26, 22, 18, 0.3);
    gap: 10px;
  }
  .menu-col .n { font-family: var(--font-body); font-size: 13px; font-weight: 600; }
  .menu-col .d { font-family: var(--font-body); font-size: 10.5px; color: var(--ink-muted); font-style: italic; }
  .menu-col .p { font-family: var(--font-mono); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .doodle-bg { position: absolute; opacity: 0.12; pointer-events: none; }
</style>
</head>
<body>
<div class="menu-sheet">
  <div class="clip"></div>

  <!-- scattered doodles -->
  <div class="doodle-bg" style="top: 80px; right: 20px;" id="d1"></div>
  <div class="doodle-bg" style="top: 300px; left: 10px;" id="d2"></div>
  <div class="doodle-bg" style="bottom: 200px; right: 30px;" id="d3"></div>
  <div class="doodle-bg" style="bottom: 60px; left: 40px;" id="d4"></div>
  <div class="doodle-bg" style="top: 600px; right: 80px;" id="d5"></div>

  <!-- Header -->
  <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px; position: relative;">
    <div id="mascot"></div>
    <div style="flex: 1;">
      <div style="font-family: var(--font-hand-bold); font-size: 44px; line-height: 0.9; transform: rotate(-1deg); display: flex; align-items: flex-start; gap: 8px; white-space: nowrap;">
        <div>FIVE ZERO THREE</div>
        <div style="font-family: var(--font-display); font-size: 18px; margin-top: 6px; letter-spacing: 0.1em;">503</div>
      </div>
      <div style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 6px; color: var(--ink-soft);">
        — Single-origin coffee & craft tea —
      </div>
    </div>
  </div>

  <!-- Two column layout -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 36px; position: relative; z-index: 2;">
    <!-- Left col -->
    <div class="menu-col">
      <h3>COFFEE</h3>
      <div id="col-coffee"></div>
      <h3 style="margin-top: 24px;">OTHER SIPS</h3>
      <div id="col-sips"></div>
    </div>

    <!-- Right col -->
    <div class="menu-col">
      <h3>WAFFLES & TOAST</h3>
      <div id="col-waffles"></div>
      <h3 style="margin-top: 24px;">SANDWICHES</h3>
      <div id="col-sandwiches"></div>
      <h3 style="margin-top: 24px;">MAINS & BITES</h3>
      <div id="col-mains"></div>
    </div>
  </div>

  <!-- Footer -->
  <div style="margin-top: 32px; padding-top: 20px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; position: relative; z-index: 2;">
    <span>CRAFTED IN NIZAMABAD, TG</span>
    <span>EST · 2024</span>
    <span>FIVEZEROTHREE.CAFE</span>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/doodles.jsx"></script>
<script type="text/babel" src="shared/menu-data.jsx"></script>

<script type="text/babel">
const Row = ({item}) => (
  <div className="row">
    <div style={{flex: 1, minWidth: 0}}>
      <div className="n">{item.n}</div>
      <div className="d">{item.d}</div>
    </div>
    <div className="p">₹{item.p}</div>
  </div>
);

const Col = ({items}) => <div>{items.map((it, i) => <Row key={i} item={it}/>)}</div>;

ReactDOM.createRoot(document.getElementById('mascot')).render(<Mascot size={88}/>);
ReactDOM.createRoot(document.getElementById('col-coffee')).render(<Col items={MENU.coffee.items}/>);
ReactDOM.createRoot(document.getElementById('col-sips')).render(<Col items={MENU.sips.items}/>);
ReactDOM.createRoot(document.getElementById('col-waffles')).render(<Col items={MENU.waffles.items}/>);
ReactDOM.createRoot(document.getElementById('col-sandwiches')).render(<Col items={MENU.sandwiches.items}/>);
ReactDOM.createRoot(document.getElementById('col-mains')).render(<Col items={MENU.mains.items}/>);

ReactDOM.createRoot(document.getElementById('d1')).render(<Bean size={40} rotate={35}/>);
ReactDOM.createRoot(document.getElementById('d2')).render(<MokaPot size={100}/>);
ReactDOM.createRoot(document.getElementById('d3')).render(<CupToGo size={90}/>);
ReactDOM.createRoot(document.getElementById('d4')).render(<Bean size={50} rotate={-30}/>);
ReactDOM.createRoot(document.getElementById('d5')).render(<Croissant size={80}/>);
</script>
</body>
</html>
