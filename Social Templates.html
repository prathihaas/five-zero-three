<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Templates · Five Zero Three</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=Caveat:wght@400;500;600;700&family=Bungee&family=Rubik+Mono+One&family=JetBrains+Mono:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css?v=2">
<style>
  body { padding: 40px 20px; background: #2a2520; min-height: 100vh; }
  .page-title {
    max-width: 1400px; margin: 0 auto 32px;
    color: var(--cream-light);
    font-family: var(--font-hand-bold); font-size: 48px;
  }
  .page-title .sub {
    font-family: var(--font-mono); font-size: 13px;
    letter-spacing: 0.2em; text-transform: uppercase;
    opacity: 0.6; margin-top: 8px;
  }
  .grid {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 36px;
  }
  .story-wrap { display: flex; flex-direction: column; gap: 8px; }
  .story-label {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--cream-light); opacity: 0.6;
  }
  .story {
    width: 100%; aspect-ratio: 9 / 16;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    border: 2px solid var(--ink);
  }
  .story.dark { background: var(--ink); color: var(--cream-light); }
  .story-pad { padding: 32px; height: 100%; display: flex; flex-direction: column; position: relative; z-index: 2; }
</style>
</head>
<body>
<div class="page-title">
  Story Templates
  <div class="sub">— 9:16 · 7 layouts ready to drop into Instagram —</div>
</div>

<div class="grid" id="grid"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/doodles.jsx"></script>
<script type="text/babel" src="shared/social-stories.jsx"></script>
</body>
</html>
